project:
  type: website
  output-dir: _site
  resources:
    - interactive/**
    - figures/**
    - assets/**

website:
  title: "What the Olive Trees Saw"
  description: "A data-driven narrative on four decades of change in Palestinian olive groves"
  navbar:
    background: "#F5F0E6"
    foreground: "#2A2A26"
    left:
      - text: "The Story"
        href: index.qmd
      - text: "Methods"
        href: appendix.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    background: "#2A2A26"
    foreground: "#F5F0E6"
    left: "DSAN-5200 Final Project · Georgetown University · Spring 2026"
    right: "Source · [GitHub](https://github.com/dsan-5200/project-2026-35)"

format:
  html:
    theme:
      - cosmo
      - theme.scss
    css: styles.css
    toc: false
    page-layout: article
    fig-responsive: true
    smooth-scroll: true
    anchor-sections: false
    link-external-newwindow: true
    mainfont: "Cormorant Garamond, Georgia, serif"
    fontsize: "1.05rem"
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <script type="module" src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css"/>
        <script defer src="https://cdn.jsdelivr.net/npm/scrollama@3.2.0/build/scrollama.min.js"></script>
        <!-- Open Graph / Twitter share-card metadata -->
        <meta property="og:type" content="article">
        <meta property="og:site_name" content="What the Olive Trees Saw">
        <meta property="og:title" content="What the Olive Trees Saw">
        <meta property="og:description" content="A data narrative on West Bank settlement expansion, olive groves, and the violence between them. By Mohammad Yassin · Georgetown University · Spring 2026.">
        <meta property="og:url" content="https://olives.myassin.georgetown.domains/">
        <meta property="og:image" content="https://olives.myassin.georgetown.domains/assets/og-card.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Title card for 'What the Olive Trees Saw': a data narrative on West Bank settlement expansion, olive groves, and the violence between them.">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="What the Olive Trees Saw">
        <meta name="twitter:description" content="A data narrative on West Bank settlement expansion, olive groves, and the violence between them.">
        <meta name="twitter:image" content="https://olives.myassin.georgetown.domains/assets/og-card.png">
        <meta name="twitter:image:alt" content="Title card for 'What the Olive Trees Saw'.">
        <meta name="author" content="Mohammad Yassin">
        <meta name="description" content="A data narrative on West Bank settlement expansion, olive groves, and the violence between them.">
        <meta name="theme-color" content="#4A5D3A">

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
