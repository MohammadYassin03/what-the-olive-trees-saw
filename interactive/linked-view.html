<style>
  :root {
    --olive-deep: #4A5D3A;
    --olive-mid:  #6B7F54;
    --sage:       #9BAA85;
    --bone:       #F5F0E6;
    --bone-pale:  #FAF6EC;
    --ink:        #2A2A26;
    --ink-soft:   #4A4A44;
    --terracotta: #B95835;
    --gold:       #C9A961;
    --rule:       #D9D2C0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bone-pale);
  }
  .container {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 1rem;
    padding: 1rem;
    height: 560px;
  }
  /* Stacked layout only kicks in on truly narrow viewports. The article
     column the linked view is embedded into is 720px wide, so a 720px
     breakpoint here would push the chart panel down to 320px and clip its
     x-axis. We trigger the stacked layout only at 600px and below, and we
     give each stacked panel enough vertical room to hold the chart's full
     SVG without clipping. */
  @media (max-width: 600px) {
    .container {
      grid-template-columns: 1fr;
      grid-template-rows: 380px 400px;
      height: auto;
    }
  }
  .panel {
    background: var(--bone);
    border: 1px solid var(--rule);
    padding: 0.75rem 1rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel h3 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
    margin: 0 0 0.25rem 0;
  }
  .panel .kicker {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.7rem;
    color: var(--olive-deep);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  #map {
    flex: 1;
    min-height: 280px;
  }
  #chart {
    flex: 1;
    min-height: 260px;
    /* Allow the SVG to be sized down by the parent if the layout is
       constrained, so the x-axis below the bars stays visible. */
    overflow: visible;
  }
  .status {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-top: 0.5rem;
    font-style: italic;
  }
  .legend {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-top: 0.5rem;
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  .legend-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--olive-deep);
    vertical-align: middle;
    margin-right: 0.35rem;
  }
  /* Leaflet tweaks */
  .leaflet-container { background: var(--bone-pale); font-family: inherit; }
  .gov-circle {
    fill: var(--olive-deep);
    fill-opacity: 0.55;
    stroke: var(--bone);
    stroke-width: 1.5;
    cursor: pointer;
    transition: fill-opacity 0.2s ease;
  }
  .gov-circle:hover, .gov-circle.selected { fill-opacity: 0.9; fill: var(--terracotta); }
  .bar { fill: var(--olive-deep); }
  .bar.highlight { fill: var(--terracotta); }
  .axis text { font-size: 10px; fill: var(--ink-soft); }
  .axis path, .axis line { stroke: var(--rule); }
</style>
</head>
<body>
<div class="container">

  <div class="panel">
    <div class="kicker">Where</div>
    <h3>Tree-related incidents by governorate</h3>
    <div id="map"></div>
    <div class="legend">
      <span><span class="legend-swatch"></span>Circle area ∝ total incidents</span>
      <span id="selected-label" style="margin-left:auto;"></span>
    </div>
  </div>

  <div class="panel">
    <div class="kicker">When</div>
    <h3>Incidents per year — <span id="chart-subject">all governorates</span></h3>
    <div id="chart"></div>
    <div class="status" id="status">Loading data …</div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
// --- Approximate governorate centroids (West Bank) --------------------------
const GOV_CENTROIDS = {
  "Jenin":      [32.462, 35.296],
  "Tubas":      [32.321, 35.369],
  "Tulkarm":    [32.311, 35.028],
  "Nablus":     [32.220, 35.255],
  "Qalqilya":   [32.189, 34.971],
  "Salfit":     [32.085, 35.181],
  "Ramallah":   [31.903, 35.206],
  "Jericho":    [31.858, 35.458],
  "Jerusalem":  [31.785, 35.230],
  "Bethlehem":  [31.705, 35.201],
  "Hebron":     [31.532, 35.095],
};

const FEED_URL = "linked_view_feed.json";

// Graceful fallback if feed isn't built yet
const SAMPLE_FEED = {
  years: Array.from({length: 21}, (_, i) => 2005 + i),
  governorates: Object.keys(GOV_CENTROIDS).map(name => ({
    name,
    total: 0,
    incidents_by_year: Object.fromEntries(
      Array.from({length: 21}, (_, i) => [String(2005 + i), 0])
    )
  }))
};

async function loadFeed() {
  // First, try the embedded JSON (works under file:// where fetch is blocked).
  try {
    const node = document.getElementById("embedded-feed");
    if (node) {
      const parsed = JSON.parse(node.textContent);
      if (parsed && parsed.governorates && parsed.governorates.length) {
        return parsed;
      }
    }
  } catch (_) { /* fall through to fetch */ }

  // Then try the side-car JSON file. This path runs when the embedded JSON
  // hasn't been populated yet (e.g. before 03_analyze.py has been run).
  try {
    const r = await fetch(FEED_URL);
    if (!r.ok) throw new Error(r.statusText);
    return await r.json();
  } catch (e) {
    console.warn("Using empty fallback feed:", e);
    document.getElementById("status").textContent =
      "Showing empty fallback. Run analysis/03_analyze.py to generate the feed.";
    return SAMPLE_FEED;
  }
}

function drawMap(feed) {
  const map = L.map("map", { scrollWheelZoom: false })
    .setView([31.95, 35.22], 8);
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    { attribution: "© OpenStreetMap · © CARTO", maxZoom: 14 }
  ).addTo(map);

  const maxTotal = Math.max(1, ...feed.governorates.map(g => g.total));

  feed.governorates.forEach(g => {
    const coords = GOV_CENTROIDS[g.name];
    if (!coords) return;
    const r = 6 + 22 * Math.sqrt(g.total / maxTotal);
    const circle = L.circleMarker(coords, {
      radius: r,
      className: "gov-circle",
      pane: "markerPane",
    }).addTo(map);
    circle.bindTooltip(`${g.name} — ${g.total.toLocaleString()} incidents`);
    circle.on("click", () => selectGovernorate(feed, g.name, circle));
  });
}

let currentChart = null;
let selectedPath = null;

function selectGovernorate(feed, name, leafletCircle) {
  // Visual state
  document.querySelectorAll(".gov-circle.selected").forEach(el => el.classList.remove("selected"));
  if (leafletCircle && leafletCircle._path) leafletCircle._path.classList.add("selected");
  document.getElementById("selected-label").textContent = name;
  document.getElementById("chart-subject").textContent = name;

  const g = feed.governorates.find(x => x.name === name);
  const series = feed.years.map(y => ({year: y, n: g.incidents_by_year[String(y)] || 0}));
  drawChart(series);
}

function drawChart(series) {
  const el = document.getElementById("chart");
  el.innerHTML = "";
  const bbox = el.getBoundingClientRect();
  const W = bbox.width, H = Math.max(260, bbox.height);
  const M = {top: 16, right: 10, bottom: 28, left: 36};

  const svg = d3.select("#chart").append("svg")
    .attr("width", W).attr("height", H);

  const x = d3.scaleBand()
    .domain(series.map(d => d.year))
    .range([M.left, W - M.right])
    .padding(0.25);

  const yMax = d3.max(series, d => d.n) || 1;
  const y = d3.scaleLinear()
    .domain([0, yMax * 1.1])
    .range([H - M.bottom, M.top]).nice();

  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${H - M.bottom})`)
    .call(d3.axisBottom(x).tickValues(x.domain().filter((_, i) => i % 3 === 0)).tickSizeOuter(0));

  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${M.left},0)`)
    .call(d3.axisLeft(y).ticks(4).tickSizeOuter(0));

  svg.selectAll(".bar")
    .data(series)
    .join("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.year))
      .attr("y", d => y(d.n))
      .attr("width", x.bandwidth())
      .attr("height", d => (H - M.bottom) - y(d.n));

  // Peak-year highlight
  const peak = series.reduce((a, b) => (b.n > a.n ? b : a), series[0]);
  svg.selectAll(".bar")
    .filter(d => d.year === peak.year && d.n > 0)
    .classed("highlight", true);
}

function drawAllGovernoratesChart(feed) {
  const totals = feed.years.map(y => ({
    year: y,
    n: feed.governorates.reduce((s, g) => s + (g.incidents_by_year[String(y)] || 0), 0)
  }));
  drawChart(totals);
}

loadFeed().then(feed => {
  drawMap(feed);
  drawAllGovernoratesChart(feed);
  document.getElementById("status").textContent =
    "Click a circle on the map to filter the chart to one governorate.";
});
</script>
